name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-nodejs
            mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-nlohmann-json

      - name: Patch Boost version requirement
        run: |
          # MSYS2 boost may not match the exact version required.
          # Remove EXACT from find_package to use whatever version is installed.
          sed -i 's/find_package(Boost CONFIG ${BOOST_VERSION} EXACT/find_package(Boost CONFIG ${BOOST_VERSION}/' \
            cmake/dependencies/Boost_Sunshine.cmake

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DCUDA_FAIL_ON_MISSING=OFF \
            -DSUNSHINE_ENABLE_TRAY=ON \
            -DBOOST_USE_STATIC=OFF \
            -DFETCHCONTENT_QUIET=OFF

      - name: Build
        run: ninja -C build

      - name: Package (NSIS installer)
        run: cpack -G NSIS --config ./build/CPackConfig.cmake

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Apollo-Windows-Installer
          path: |
            *.exe
          retention-days: 90

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.exe"
          draft: true
          generate_release_notes: true
